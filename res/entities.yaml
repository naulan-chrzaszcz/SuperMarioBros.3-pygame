# Entities that the map editor places on a map and that the game brings to life.
#
# A map stores them in its "entities" list: {"type": <id>, "x": <column>, "y": <row>}.
#
#   behaviour:   Python class that moves it (src/entities/spawner.py,
#                ENTITY_CLASSES), default is the id. "generic" needs no Python:
#                its settings below say what it does. Several ids can share a
#                behaviour with other pictures and settings (see red_koopa).
#   image:       id of the sheet in ressources.yaml
#   animations:  named pictures. Each one is a [x, y, width, height] frame, a
#                list of frames, or {frames: [...], period: <seconds per frame>,
#                mirror: <also play the frames flipped>}. Each behaviour needs
#                some names (the ANIMATIONS of its class).
#   facing:      left (default) or right: where the sheet makes it look
#   frame:       picture shown in the editor, default is the first frame of
#                the first animation
#   flip:        draw the editor picture flipped
#   palette:     [[from r, g, b], [to r, g, b]] color swaps applied to the sheet
#   settings:    constants of the behaviour, in camelCase (speed: 40 sets SPEED).
#                They also choose what it does, among the effects of its class:
#                  movement: walk (default, at "speed") or still
#                  onStomp / onTouch (Mario lands on it / walks into it):
#                    hurt (default), squash, collect, nothing, shell (koopa)
#                  collect:  what a collected entity gives: grow or life
#                  onKnock (a shell or the block under it hits it):
#                    flip (default, falls off the screen), hop or nothing
#                  onWake:   where it looks when it starts: face_mario, left, right
#                  animation: the animation it plays (default walk)
#                  turns:    false to always draw it as in the sheet
#                An unknown name is reported with the list of the known ones.
#   unique:      a map holds at most one of them
#   description: help shown in the editor
entities:
  - id: start
    name: Mario start
    image: mario
    frame: [0, 0, 16, 16]
    flip: true
    unique: true
    description: Where Mario appears. Default is the first ground from the left.

  - id: goomba
    name: Goomba
    behaviour: generic
    image: goomba
    animations:
      walk: {frames: [[0, 0, 16, 16]], period: 0.15, mirror: true}
      squashed: [16, 0, 16, 16]
    settings:
      enemy: true
      onStomp: squash
      speed: 32
      squashedDuration: 0.5
    description: Walks and falls off ledges. Stomp it!

  - id: koopa
    name: Koopa Troopa
    image: koopa
    animations: &koopa
      walk: {frames: [[0, 0, 16, 27], [16, 0, 16, 27]], period: 0.15}
      shell: [32, 0, 16, 16]
      # The last shell of the sheet is one pixel narrower.
      spin: {frames: [[32, 0, 16, 16], [64, 0, 16, 16], [80, 0, 16, 16], [96, 0, 15, 16]], period: 0.05}
      shake: {frames: [[32, 0, 16, 16], [48, 0, 16, 16]], period: 0.15}
    settings:
      speed: 32
      shellSpeed: 180
      wakeUpTime: 7
    description: Stomp it to get its shell, then kick the shell into enemies.

  - id: red_koopa
    name: Red Koopa Troopa
    behaviour: koopa
    image: koopa
    animations: *koopa
    palette:
      - [[98, 226, 64], [228, 52, 20]]
    settings:
      turnAtLedges: true
    description: A koopa that turns back at the edge of a floor.

  - id: mushroom
    name: Super Mushroom
    behaviour: generic
    image: mushroom
    animations: &item_idle
      idle: [0, 0, 16, 16]
    settings: &item_settings
      width: 16
      height: 16
      canHide: true
      animation: idle
      turns: false
      speed: 60
      onWake: right
      onStomp: collect
      onTouch: collect
      onKnock: hop
      collect: grow
    description: Makes Mario big. Put it on a solid block to hide it inside.

  - id: one_up
    name: 1-Up Mushroom
    behaviour: generic
    image: mushroom
    animations: *item_idle
    palette:
      - [[248, 24, 16], [0, 168, 0]]
      - [[192, 0, 16], [0, 104, 0]]
    settings:
      <<: *item_settings
      collect: life
    description: Gives a life. Put it on a solid block to hide it inside.
