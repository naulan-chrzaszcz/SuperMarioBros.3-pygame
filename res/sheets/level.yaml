# Tiles of level.png: their name, and for some of them what they do in a level.
#
#   behaviour: coin            collected when Mario touches it
#              question_block  gives a coin (or the item placed on it) when hit from below
#              brick           big Mario breaks it from below
#              hurt            hurts Mario (spikes, lava...)
#              goal            clears the course
#   becomes:   the tile drawn once a question_block is used
#   A set of names ending in _frame_0, _frame_1, ... forms one animation,
#   regardless of where its frames are in the image.
