# Style checked by pycodestyle (see CONTRIBUTING.md); the editor settings are
# in .editorconfig.
[pycodestyle]
max_line_length = 110
# The default ignores, plus E402: the tests set SDL_VIDEODRIVER before
# importing pygame, so their imports cannot all be at the top of the file.
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E402

[isort]
profile = black
line_length = 110
known_first_party = src,map_editor,tests
