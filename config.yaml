framerateLimit: 120
skipIntro: true
mixer:
  frequency: 22050
  size: -16
  channels: 2
  buffer: 512
# Size of the game image; it is scaled to the window without distortion.
display:
  width: 464
  height: 240
screen:
  width: 1280
  height: 720
  flags: 0
  depth: 32
  resizable: true
  # true: sharp square pixels (integer zoom) with black borders.
  integerScaling: false
mouse:
  visible: false
# pygame key names (https://www.pygame.org/docs/ref/key.html)
controls:
  up: [z, up]
  down: [s, down]
  left: [q, left]
  right: [d, right]
  # confirm also jumps in the levels, hold run to run.
  confirm: [a, return, space]
  back: [escape]
  run: [left shift, right shift, e]
